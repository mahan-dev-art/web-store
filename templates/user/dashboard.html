{% extends 'base.html' %}

{% block header %}
    <title>داشبورد کاربری</title>
{% endblock header %}

{% block body %}
    <h1>user dashboard panel</h1>

    
    {% for cart in current_user.carts|selectattr('status' , '!=' , 'pending') %}
        <a href="{{ url_for('user.order' , id=cart.id) }}"> {{ cart.id }} -- {{ cart.status }} </a> <br>
    {% endfor %}
        
{% endblock body %}
