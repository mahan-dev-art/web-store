{% extends 'base.html' %}

{% block header %}
    <title>فروشگاه اینترنتی ماهان</title>
{% endblock header %}

{% block body %}
    
    {% for p in products %}
    <img src="/static/cover/{{ p.id }}.png" style="width: 200px;"><br>
        <a href="{{ url_for('general.product' , id=p.id , name=p.name) }}">{{ p.name }}</a><br>
    {% endfor %}
        
{% endblock body %}
