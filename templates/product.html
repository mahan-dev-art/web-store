{% extends 'base.html' %}

{% block header %}
    <title>{{ product.name }}</title>
{% endblock header %}

{% block body %}
    
    {{ product.id }}<br>
    {{ product.name }}<br>
    {{ product.price }}<br>

    <form action="/add-to-cart" method="get">
        <input type="hidden" name="id" value="{{ product.id }}">
        <input type="submit" value="اضافه کردن به سبد خرید">
    </form>


        
{% endblock body %}
